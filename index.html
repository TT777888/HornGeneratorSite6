<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HORN GENERATOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  
  :root {
    --bg-white: #ffffff;
    --panel-bg: #f7f7f7;
    --text-black: #000000;
    --border: #e5e5e5;
    --font-ui: 'Helvetica Neue', Arial, sans-serif;
    --font-logo: 'Syne', sans-serif;
  }

  body { 
    background: var(--bg-white); 
    color: var(--text-black); 
    overflow: hidden; 
    height: 100vh; 
    width: 100vw; 
    font-family: var(--font-ui); 
  }

  /* 画面全体管理 */
  .page { 
    position: absolute; 
    inset: 0; 
    display: none; 
    flex-direction: column; 
    opacity: 0; 
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
    background: var(--bg-white);
  }
  .page.active { display: flex; opacity: 1; z-index: 10; }

  .typo-logo { font-family: var(--font-logo); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ──── 1ページ目: START画面 ──── */
  #intro-page { justify-content: center; align-items: center; text-align: center; }
  .intro-container { display: flex; align-items: center; justify-content: center; gap: 30px; margin-bottom: 50px; }
  .logo-graphic { width: 60px; height: 120px; background: var(--text-black); clip-path: polygon(100% 0, 0% 100%, 100% 100%); transform: skewX(-10deg); }
  .intro-text-group { text-align: left; }
  .intro-logo { font-size: 52px; line-height: 1.0; }
  .intro-subtitle { font-size: 13px; color: #666; letter-spacing: 0.05em; margin-top: 5px; font-weight: 500; }
  .btn-start { padding: 18px 60px; background: var(--text-black); border: none; color: #fff; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; border-radius: 50px; transition: transform 0.2s; }
  .btn-start:hover { transform: scale(1.04); }

  /* ──── 2ページ目: 生物選択画面 ──── */
  #select-page { justify-content: center; align-items: center; }
  .select-title { font-size: 18px; font-weight: 700; margin-bottom: 40px; letter-spacing: 0.05em; }
  .selection-grid { display: flex; gap: 60px; margin-bottom: 40px; }
  .animal-card { text-align: center; cursor: pointer; }
  .animal-card img { width: 200px; height: 200px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); transition: 0.3s; }
  .animal-card:hover img { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
  .animal-card p { margin-top: 15px; font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }

  /* ──── 3ページ目: ジェネレーター画面（完全再現版） ──── */
  #main-page { display: flex; flex-direction: column; }
  
  /* 上部3Dビュワーエリア */
  #viewer-container { flex: 1; background: var(--bg-white); position: relative; width: 100%; }
  .header-logo { position: absolute; top: 30px; left: 40px; z-index: 200; font-size: 20px; font-weight: 800; }
  
  .download-area { position: absolute; top: 25px; right: 40px; z-index: 200; }
  .btn-dl-circle { width: 44px; height: 44px; background: #fff; border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .btn-dl-circle:hover { transform: scale(1.05); background: #f9f9f9; }
  .btn-dl-circle svg { width: 18px; height: 18px; fill: none; stroke: var(--text-black); stroke-width: 1.5; }

  /* 下部コントロールパネル（画像3.52版に完全準拠） */
  #step-panel { height: 320px; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 0 40px; }
  
  /* 中央コントロールナビ構造 */
  .step-nav-container { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 720px; gap: 30px; }
  
  /* 丸い浮遊矢印ボタン */
  .nav-arrow-btn { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.03); flex-shrink: 0; }
  .nav-arrow-btn:hover { background: #fdfdfdfd; transform: scale(1.05); }
  .nav-arrow-btn.disabled { opacity: 0.2; cursor: default; transform: none; }
  .nav-arrow-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--text-black); stroke-width: 2; }

  #steps-contents-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 160px; }
  .step-content { text-align: center; display: none; width: 100%; }
  .step-content.active { display: block; }

  /* ステップカウンターと特大ロゴ名 */
  .step-meta { font-size: 11px; font-weight: 700; color: #a2a2a2; letter-spacing: 0.2em; margin-bottom: 8px; text-transform: uppercase; }
  .step-title { font-family: var(--font-logo); font-size: 40px; font-weight: 800; margin-bottom: 25px; color: var(--text-black); line-height: 1.0; }

  /* インターフェースラッパー */
  .ui-flex-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; height: 50px; }
  .guide-txt { font-size: 11px; font-weight: 700; color: #b5b5b5; text-transform: uppercase; letter-spacing: 0.1em; min-width: 60px; }
  .guide-txt.left { text-align: right; }
  .guide-txt.right { text-align: left; }

  /* 5連ラジオノード */
  .circle-grid { display: flex; gap: 16px; align-items: center; justify-content: center; }
  .node-circle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #dcdcdc; cursor: pointer; background: #ffffff; transition: 0.2s; }
  .node-circle.selected { border-color: #000000; background: #222222; box-shadow: inset 0 0 0 4px #ffffff; }

  /* カラーパレット（形状・サイズ・隙間を5連ノードに完全同調） */
  .color-grid { display: flex; gap: 16px; justify-content: center; align-items: center; }
  .color-node { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.12); position: relative; transition: transform 0.2s; }
  .color-node.active { box-shadow: 0 0 0 3px var(--panel-bg), 0 0 0 5px #000; transform: scale(1.05); }
  
  .picker-node-wrapper { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #dcdcdc; cursor: pointer; background: conic-gradient(red, yellow, lime, aqua, blue, fuchsia, red); position: relative; overflow: hidden; transition: transform 0.2s; }
  .picker-node-wrapper.active { box-shadow: 0 0 0 3px var(--panel-bg), 0 0 0 5px #000; transform: scale(1.05); }
  #custom-color { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  /* 右下固定のREGENERATEボタン */
  .finish-action-area { position: absolute; right: 40px; bottom: 35px; z-index: 200; }
  .btn-regenerate { padding: 16px 36px; background: #000000; color: #ffffff; border: none; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; cursor: pointer; transition: background 0.2s; text-transform: uppercase; border-radius: 0; }
  .btn-regenerate:hover { background: #222222; }

  /* ──── モバイルレスポンシブ完全一致 ──── */
  @media (max-width: 799px) {
    .selection-grid { flex-direction: column; gap: 30px; }
    .header-logo { left: 20px; top: 25px; font-size: 16px; }
    .download-area { right: 20px; top: 20px; }
    
    #step-panel { height: 260px; padding: 0 15px 60px 15px; }
    .step-nav-container { gap: 12px; }
    .nav-arrow-btn { width: 42px; height: 42px; }
    .step-title { font-size: 28px; margin-bottom: 15px; }
    
    .ui-flex-row { gap: 8px; }
    .guide-txt { min-width: 45px; font-size: 9px; }
    
    .circle-grid { gap: 10px; }
    .node-circle { width: 30px; height: 30px; }
    
    .color-grid { gap: 10px; }
    .color-node { width: 30px; height: 30px; }
    .picker-node-wrapper { width: 30px; height: 30px; }

    .finish-action-area { left: 50%; transform: translateX(-50%); right: auto; bottom: 12px; width: calc(100% - 30px); text-align: center; }
    .btn-regenerate { width: 100%; padding: 12px 0; }
  }
</style>
</head>
<body>

<div id="intro-page" class="page active">
  <div class="intro-container">
    <div class="logo-graphic"></div>
    <div class="intro-text-group">
      <div class="intro-logo typo-logo">TSUNO</div>
      <div class="intro-subtitle">Horn Generator Site</div>
    </div>
  </div>
  <button class="btn-start" onclick="navPage('select-page')">START</button>
</div>

<div id="select-page" class="page">
  <h2 class="select-title">お好きな角を選択してください</h2>
  <div class="selection-grid">
    <div class="animal-card" onclick="launchGenerator('スイギュウ')">
      <img src="https://images.unsplash.com/photo-1547989453-11e67ffb3885?auto=format&fit=crop&w=400&q=80" alt="スイギュウ">
      <p>スイギュウ</p>
    </div>
    <div class="animal-card" onclick="launchGenerator('ヘラジカ')">
      <img src="https://images.unsplash.com/photo-1549488344-1f9b8d2bd1f3?auto=format&fit=crop&w=400&q=80" alt="ヘラジカ">
      <p>ヘラジカ</p>
    </div>
  </div>
</div>

<div id="main-page" class="page">
  <div id="viewer-container">
    <div class="header-logo typo-logo">HORN GENERATOR</div>
    <div class="download-area">
      <button class="btn-dl-circle" onclick="exportObjMesh()" title="Download .obj">
        <svg viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path><polyline points="7 11 12 16 17 11"></polyline><line x1="12" y1="16" x2="12" y2="4"></line></svg>
      </button>
    </div>
    <div id="three-canvas" style="width:100%; height:100%;"></div>
  </div>

  <div id="step-panel">
    <div class="finish-action-area">
      <button class="btn-regenerate" onclick="triggerRegen()">REGENERATE</button>
    </div>

    <div class="step-nav-container">
      <button class="nav-arrow-btn disabled" id="prev-btn" onclick="slideStep(-1)">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      
      <div id="steps-contents-box">
        
        <div class="step-content active">
          <p class="step-meta">Step 01 / 05</p>
          <h3 class="step-title">SIZE</h3>
          <div class="ui-flex-row">
            <span class="guide-txt left">Short</span>
            <div class="circle-grid">
              <div class="node-circle" onclick="updateConfig('size', 1, this)"></div>
              <div class="node-circle" onclick="updateConfig('size', 2, this)"></div>
              <div class="node-circle selected" onclick="updateConfig('size', 3, this)"></div>
              <div class="node-circle" onclick="updateConfig('size', 4, this)"></div>
              <div class="node-circle" onclick="updateConfig('size', 5, this)"></div>
            </div>
            <span class="guide-txt right">Long</span>
          </div>
        </div>

        <div class="step-content">
          <p class="step-meta">Step 02 / 05</p>
          <h3 class="step-title">THICKNESS</h3>
          <div class="ui-flex-row">
            <span class="guide-txt left">Thin</span>
            <div class="circle-grid">
              <div class="node-circle" onclick="updateConfig('thickness', 1, this)"></div>
              <div class="node-circle" onclick="updateConfig('thickness', 2, this)"></div>
              <div class="node-circle selected" onclick="updateConfig('thickness', 3, this)"></div>
              <div class="node-circle" onclick="updateConfig('thickness', 4, this)"></div>
              <div class="node-circle" onclick="updateConfig('thickness', 5, this)"></div>
            </div>
            <span class="guide-txt right">Thick</span>
          </div>
        </div>

        <div class="step-content">
          <p class="step-meta">Step 03 / 05</p>
          <h3 class="step-title">CURVE</h3>
          <div class="ui-flex-row">
            <span class="guide-txt left">Straight</span>
            <div class="circle-grid">
              <div class="node-circle" onclick="updateConfig('bend', 1, this)"></div>
              <div class="node-circle" onclick="updateConfig('bend', 2, this)"></div>
              <div class="node-circle selected" onclick="updateConfig('bend', 3, this)"></div>
              <div class="node-circle" onclick="updateConfig('bend', 4, this)"></div>
              <div class="node-circle" onclick="updateConfig('bend', 5, this)"></div>
            </div>
            <span class="guide-txt right">Curved</span>
          </div>
        </div>

        <div class="step-content">
          <p class="step-meta">Step 04 / 05</p>
          <h3 class="step-title">BUMP</h3>
          <div class="ui-flex-row">
            <span class="guide-txt left">Smooth</span>
            <div class="circle-grid">
              <div class="node-circle" onclick="updateConfig('bump', 1, this)"></div>
              <div class="node-circle" onclick="updateConfig('bump', 2, this)"></div>
              <div class="node-circle selected" onclick="updateConfig('bump', 3, this)"></div>
              <div class="node-circle" onclick="updateConfig('bump', 4, this)"></div>
              <div class="node-circle" onclick="updateConfig('bump', 5, this)"></div>
            </div>
            <span class="guide-txt right">Rough</span>
          </div>
        </div>
        
        <div class="step-content">
          <p class="step-meta">Step 05 / 05</p>
          <h3 class="step-title">COLOR</h3>
          <div class="ui-flex-row">
            <span class="guide-txt left" style="visibility:hidden;">-</span>
            <div class="color-grid" id="palette">
              <div class="color-node active" data-color="#ffffff" style="background-color: #ffffff;"></div>
              <div class="color-node" data-color="#d00b1d" style="background-color: #d00b1d;"></div>
              <div class="color-node" data-color="#010066" style="background-color: #010066;"></div>
              <div class="color-node" data-color="#FFD400" style="background-color: #FFD400;"></div>
              <div class="picker-node-wrapper"><input type="color" id="custom-color" value="#ffffff"></div>
            </div>
            <span class="guide-txt right" style="visibility:hidden;">-</span>
          </div>
        </div>

      </div>

      <button class="nav-arrow-btn" id="next-btn" onclick="slideStep(1)">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJExporter } from "three/addons/exporters/OBJExporter.js";

let settings = { size: 3, thickness: 3, bend: 3, bump: 3, color: "#ffffff", animal: "スイギュウ" };
let dna;

function buildDNA() {
  const r1 = Math.random(), r2 = Math.random(), r3 = Math.random();
  dna = {
    seed: Math.random() * 500,
    variationX: (r1 * 2.5 - 1.25),
    variationZ: (r2 * 2.5 - 1.25),
    noiseFrequency: 1.5 + r3 * 3.0, 
    noiseBase: Array.from({ length: 300 }, () => Math.random())
  };
}
buildDNA();

let scene, camera, renderer, controls, hornGroup, currentStep = 0;

window.navPage = (pageId) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
};

window.launchGenerator = (mode) => {
  settings.animal = mode;
  window.navPage('main-page');
  if (!scene) {
    initThreeContext();
  } else {
    rebuildHornGeometry();
  }
};

window.slideStep = (dir) => {
  const steps = document.querySelectorAll('.step-content');
  steps[currentStep].classList.remove('active');
  currentStep = Math.max(0, Math.min(steps.length - 1, currentStep + dir));
  steps[currentStep].classList.add('active');
  
  document.getElementById('prev-btn').classList.toggle('disabled', currentStep === 0);
  document.getElementById('next-btn').classList.toggle('disabled', currentStep === steps.length - 1);
};

window.updateConfig = (key, val, el) => {
  const container = el.parentElement;
  container.querySelectorAll('.node-circle').forEach(n => n.classList.remove('selected'));
  el.classList.add('selected');
  settings[key] = val;
  rebuildHornGeometry();
};

window.triggerRegen = () => { buildDNA(); rebuildHornGeometry(); };

window.exportObjMesh = () => {
  const exporter = new OBJExporter();
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([exporter.parse(hornGroup)], { type: 'text/plain' }));
  link.download = `horn_${settings.animal}.obj`; 
  link.click();
};

function initThreeContext() {
  const parentBox = document.getElementById("viewer-container");
  scene = new THREE.Scene(); 
  scene.background = new THREE.Color(0xffffff); // 元版と同じ白背景
  
  camera = new THREE.PerspectiveCamera(40, parentBox.clientWidth / parentBox.clientHeight, 0.1, 1000);
  camera.position.set(0, 4, 18);
  
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(parentBox.clientWidth, parentBox.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById("three-canvas").appendChild(renderer.domElement);
  
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const mainLight = new THREE.DirectionalLight(0xffffff, 1.0); 
  mainLight.position.set(10, 20, 10); 
  scene.add(mainLight);
  
  const fillLight = new THREE.DirectionalLight(0xeeeeee, 0.4);
  fillLight.position.set(-10, -5, -10);
  scene.add(fillLight);
  
  hornGroup = new THREE.Group(); 
  scene.add(hornGroup);
  
  renderLoop(); 
  rebuildHornGeometry();
}

function computeMaterial() {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(settings.color),
    roughness: 0.65,
    metalness: 0.04,
    side: THREE.DoubleSide
  });
}

function generateMeshStream(scale = 1.0) {
  const points = [], segments = 80, radSegs = 24;
  
  const baseUnitLength = 2.0; 
  const growthLen = settings.size * baseUnitLength * scale;
  const bendStr = Math.pow(settings.bend, 1.6) * 0.42;
  
  const sX = dna.seed + 1.2;
  const sZ = dna.seed + 2.8;

  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    const curveProgress = t * baseUnitLength * 3.0; 
    const p = new THREE.Vector3(0, t * growthLen, 0);
    
    const curveX = curveProgress * 0.35 + sX + dna.variationX;
    const curveZ = curveProgress * 0.35 + sZ + dna.variationZ;
    
    let xOff = Math.sin(curveX) * bendStr * 0.22 * Math.pow(t, 1.3) * 5.0;
    let zOff = Math.cos(curveZ) * bendStr * 0.22 * Math.pow(t, 1.3) * 5.0;
    
    // スイギュウ選択時の左右への広がりエフェクト
    if (settings.animal === "スイギュウ") {
      xOff += Math.pow(t, 1.4) * 3.0;
    }
    
    p.x += xOff; p.z += zOff; 
    points.push(p);
  }
  
  const curve = new THREE.CatmullRomCurve3(points);
  const pRadius = 0.5 * (settings.size * 0.03 + 0.5) * (settings.thickness * 0.22 + 0.45);
  
  const vertices = [], indices = [], uvs = [], frames = curve.computeFrenetFrames(segments, false);

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    
    const bumpAmp = Math.pow(settings.bump, 2.0) * 0.015;
    const noiseIdx = Math.floor(t * 299 * dna.noiseFrequency) % 300;
    const bump = 1.0 + (dna.noiseBase[noiseIdx] - 0.5) * bumpAmp * (1.1 - t);
    
    const r = Math.max(0.01, pRadius * Math.pow(1.0 - t, 0.9) * bump);
    
    const p = curve.getPointAt(t), n = frames.normals[i], b = frames.binormals[i];
    for (let j = 0; j <= radSegs; j++) {
      const a = (j / radSegs) * Math.PI * 2;
      const v = new THREE.Vector3().copy(p).add(n.clone().multiplyScalar(Math.cos(a)*r)).add(b.clone().multiplyScalar(Math.sin(a)*r));
      vertices.push(v.x, v.y, v.z);
      uvs.push(j / radSegs, t); // 【バグ修正】uvvsタイポを完全修正して3D描画エラーを解消
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radSegs; j++) {
      const a = i*(radSegs+1)+j, b = (i+1)*(radSegs+1)+j, c = (i+1)*(radSegs+1)+(j+1), d = i*(radSegs+1)+(j+1);
      indices.push(a, b, d, b, c, d);
    }
  }

  // 根元キャップ（空洞防止蓋）
  const capBottomIdx = vertices.length / 3;
  vertices.push(points[0].x, points[0].y, points[0].z); uvs.push(0.5, 0);
  for (let j = 0; j < radSegs; j++) {
    indices.push(capBottomIdx, j + 1, j);
  }
  
  // 先端キャップ（空洞防止蓋）
  const capTopIdx = vertices.length / 3;
  const targetEnd = curve.getPointAt(1);
  vertices.push(targetEnd.x, targetEnd.y, targetEnd.z); uvs.push(0.5, 1);
  const offsetLast = segments * (radSegs + 1);
  for (let j = 0; j < radSegs; j++) {
    indices.push(capTopIdx, offsetLast + j, offsetLast + j + 1);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices); 
  geo.computeVertexNormals();
  
  return new THREE.Mesh(geo, computeMaterial());
}

function rebuildHornGeometry() {
  if(!hornGroup) return;
  while(hornGroup.children.length > 0) {
    const child = hornGroup.children[0]; 
    child.geometry.dispose(); 
    child.material.dispose(); 
    hornGroup.remove(child);
  }
  
  // 美しい対（つい）になるよう、左右一対でツノを生成・配置
  const leftMesh = generateMeshStream();
  leftMesh.position.x = -1.6;
  leftMesh.rotation.z = 0.25;
  hornGroup.add(leftMesh);

  const rightMesh = generateMeshStream();
  rightMesh.position.x = 1.6;
  rightMesh.rotation.z = -0.25;
  rightMesh.scale.x = -1; // 鏡像反転
  hornGroup.add(rightMesh);
  
  const boundingBox = new THREE.Box3().setFromObject(hornGroup);
  const centerVec = new THREE.Vector3(); 
  boundingBox.getCenter(centerVec);
  hornGroup.children.forEach(m => {
    m.position.y -= centerVec.y - 1.0; // 常にビュワー中心に綺麗に浮遊配置
  });
}

function renderLoop() { 
  requestAnimationFrame(renderLoop); 
  if (controls) controls.update(); 
  renderer.render(scene, camera); 
}

// ──── パレットイベント ────
document.getElementById('palette').onclick = (e) => {
  if (e.target.classList.contains('color-node')) {
    document.querySelector('.color-node.active')?.classList.remove('active');
    document.querySelector('.picker-node-wrapper.active')?.classList.remove('active');
    
    e.target.classList.add('active');
    settings.color = e.target.dataset.color;
    rebuildHornGeometry();
  }
};

document.getElementById('custom-color').oninput = (e) => {
  document.querySelector('.color-node.active')?.classList.remove('active');
  document.querySelector('.picker-node-wrapper').classList.add('active');
  
  settings.color = e.target.value; 
  rebuildHornGeometry();
};

window.onresize = () => {
  const container = document.getElementById("viewer-container");
  if(!container) return;
  camera.aspect = container.clientWidth / container.clientHeight; 
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
};
</script>
</body>
</html>
