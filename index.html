<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TSUNO | HORN GENERATOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  :root {
    --bg-white: #ffffff;
    --panel-bg: #f7f7f7;
    --text-black: #000000;
    --border: #e5e5e5;
    --font-ui: 'Helvetica Neue', Arial, sans-serif;
    --font-logo: 'Syne', sans-serif;
    --bone-white: #ffffff;
  }
  body { background: var(--bg-white); color: var(--text-black); overflow: hidden; height: 100vh; width: 100vw; font-family: var(--font-ui); }

  .page { position: absolute; inset: 0; display: none; flex-direction: column; opacity: 0; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  .page.active { display: flex; opacity: 1; z-index: 10; }

  .typo-logo { font-family: var(--font-logo); font-weight: 800; text-transform: uppercase; line-height: 1.1; }

  #intro-page { background: var(--bg-white); justify-content: center; align-items: center; text-align: center; padding: 0 10px; }
  .intro-logo { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(20px, 8vw, 32px); margin-bottom: 15px; text-align: center; width: 100%; letter-spacing: 0.05em; }
  @media (min-width: 800px) { .intro-logo { flex-direction: row; gap: 0.3em; font-size: 32px; letter-spacing: 0.1em; white-space: nowrap; } }

  .intro-subtitle { font-size: clamp(10px, 3vw, 13px); color: #888; letter-spacing: 0.25em; margin-bottom: 45px; }
  .btn-ui-main { padding: 18px 50px; background: var(--text-black); border: none; color: #fff; cursor: pointer; font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.2em; font-weight: 700; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; border-radius: 0; text-transform: uppercase; display: inline-block; }
  @media (hover: hover) { .btn-ui-main:hover { transform: scale(1.06); opacity: 0.9; } }

  #main-page { display: flex; flex-direction: column; }
  #viewer-container { flex: 1; background: #fff; position: relative; }
  .header-logo { position: absolute; top: 20px; left: 20px; z-index: 200; font-size: clamp(10px, 2.5vw, 14px); white-space: nowrap; font-family: var(--font-logo); font-weight: 800; text-transform: uppercase; }
  .download-area { position: absolute; top: 15px; right: 15px; z-index: 200; }
  .btn-dl-minimal { width: 46px; height: 46px; background: #fff; border: 1px solid #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
  .btn-dl-minimal svg { width: 20px; height: 20px; fill: none; stroke: var(--text-black); stroke-width: 1.3; }

  #step-panel { height: 260px; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; z-index: 100; position: relative; }
  .step-nav { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vw, 20px); width: 100%; max-width: 900px; }
  .nav-arrow { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ddd; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 16px; color: var(--text-black); flex-shrink: 0; }
  .nav-arrow.disabled { opacity: 0.1; cursor: default; }

  #steps-container { width: 100%; max-width: 340px; min-height: 150px; display: flex; align-items: flex-start; justify-content: center; }
  .step-content { text-align: center; display: none; width: 100%; }
  .step-content.active { display: block; animation: slideUp 0.4s ease forwards; }

  .step-counter { font-size: 8px; color: #aaa; letter-spacing: 0.3em; margin-bottom: 6px; font-weight: 700; }
  .step-name { font-family: var(--font-logo); font-size: clamp(20px, 6vw, 24px); font-weight: 800; margin-bottom: 20px; letter-spacing: -0.01em; }

  .control-wrapper { position: relative; width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; gap: 15px; }
  .range-guides { width: 45px; font-size: 10px; color: #ccc; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .range-guides.left { text-align: right; }
  .range-guides.right { text-align: left; }

  .circle-grid { display: flex; gap: 20px; justify-content: center; align-items: center; }
  .radio-circle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; background: #ffffff; transition: 0.2s; }
  .radio-circle.selected { border-color: #000000; background: #333333; box-shadow: inset 0 0 0 4px #ffffff; }

  .color-grid { display: flex; gap: 20px; justify-content: center; align-items: center; }
  .color-dot { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.15); position: relative; overflow: hidden; transition: transform 0.2s; }
  .color-dot.active { box-shadow: 0 0 0 3px #f7f7f7, 0 0 0 5px #000; transform: scale(1.05); }

  .color-picker-wrapper { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ddd; cursor: pointer; background: conic-gradient(red, yellow, lime, aqua, blue, fuchsia, red); position: relative; overflow: hidden; transition: transform 0.2s; }
  .color-picker-wrapper.active { box-shadow: 0 0 0 3px #f7f7f7, 0 0 0 5px #000; transform: scale(1.05); }
  #custom-color { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  .finish-area { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; width: auto; }
  .btn-regen-mobile { padding: 10px 22px; font-size: 9px; white-space: nowrap; }

  @media (max-width: 799px) {
    #steps-container { max-width: 290px; } 
    .control-wrapper { gap: 8px; }
    .range-guides { width: 35px; font-size: 9px; }
    
    .circle-grid { gap: 12px; }
    .radio-circle { width: 32px; height: 32px; }

    .color-grid { gap: 12px; }
    .color-dot { width: 32px; height: 32px; }
    .color-picker-wrapper { width: 32px; height: 32px; }
  }

  @media (min-width: 800px) {
    #steps-container { max-width: 400px; margin-top: 15px; }
    .step-counter { font-size: 10px; margin-bottom: 8px; }
    .step-name { font-size: 32px; margin-bottom: 25px; } 
    .step-nav { gap: 80px; } 
    .nav-arrow { width: 54px; height: 54px; font-size: 18px; }
    #step-panel { padding-top: 22px; height: 280px; } 
    .finish-area { position: absolute; bottom: 35px; right: 40px; left: auto; transform: none; }
    .btn-regen-mobile { padding: 14px 44px; font-size: 10px; }
    .header-logo { top: 25px; left: 30px; }
    .download-area { top: 25px; right: 40px; }
  }
</style>
</head>
<body>

<div id="intro-page" class="page active">
  <div class="intro-logo typo-logo"><span>HORN</span><span>GENERATOR</span></div>
  <div class="intro-subtitle">Produced By Shachihata Inc.</div>
  <button class="btn-ui-main" onclick="startApp()">START GENERATING</button>
</div>

<div id="main-page" class="page">
  <div id="viewer-container">
    <div class="header-logo typo-logo">HORN GENERATOR</div>
    <div class="download-area">
      <button class="btn-dl-minimal" onclick="downloadModel()" title="Download .obj"><svg viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path><polyline points="7 11 12 16 17 11"></polyline><line x1="12" y1="16" x2="12" y2="4"></line></svg></button>
    </div>
    <div id="three-canvas" style="width:100%; height:100%;"></div>
  </div>

  <div id="step-panel">
    <div class="step-nav">
      <button class="nav-arrow disabled" id="prev-btn" onclick="changeStep(-1)">←</button>
      <div id="steps-container">
        
        <div class="step-content active">
          <p class="step-counter">STEP 01 / 05</p>
          <p class="step-name">SIZE</p>
          <div class="control-wrapper">
            <span class="range-guides left">Short</span>
            <div class="circle-grid" data-param="size">
              <div class="radio-circle" onclick="setNodeValue('size', 1, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('size', 2, this)"></div>
              <div class="radio-circle selected" onclick="setNodeValue('size', 3, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('size', 4, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('size', 5, this)"></div>
            </div>
            <span class="range-guides right">Long</span>
          </div>
        </div>

        <div class="step-content">
          <p class="step-counter">STEP 02 / 05</p>
          <p class="step-name">THICKNESS</p>
          <div class="control-wrapper">
            <span class="range-guides left">Thin</span>
            <div class="circle-grid" data-param="thickness">
              <div class="radio-circle" onclick="setNodeValue('thickness', 1, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('thickness', 2, this)"></div>
              <div class="radio-circle selected" onclick="setNodeValue('thickness', 3, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('thickness', 4, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('thickness', 5, this)"></div>
            </div>
            <span class="range-guides right">Thick</span>
          </div>
        </div>

        <div class="step-content">
          <p class="step-counter">STEP 03 / 05</p>
          <p class="step-name">CURVE</p>
          <div class="control-wrapper">
            <span class="range-guides left">Straight</span>
            <div class="circle-grid" data-param="bend">
              <div class="radio-circle" onclick="setNodeValue('bend', 1, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('bend', 2, this)"></div>
              <div class="radio-circle selected" onclick="setNodeValue('bend', 3, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('bend', 4, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('bend', 5, this)"></div>
            </div>
            <span class="range-guides right">Curved</span>
          </div>
        </div>

        <div class="step-content">
          <p class="step-counter">STEP 04 / 05</p>
          <p class="step-name">BUMP</p>
          <div class="control-wrapper">
            <span class="range-guides left">Smooth</span>
            <div class="circle-grid" data-param="bump">
              <div class="radio-circle" onclick="setNodeValue('bump', 1, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('bump', 2, this)"></div>
              <div class="radio-circle selected" onclick="setNodeValue('bump', 3, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('bump', 4, this)"></div>
              <div class="radio-circle" onclick="setNodeValue('bump', 5, this)"></div>
            </div>
            <span class="range-guides right">Rough</span>
          </div>
        </div>
        
        <div class="step-content">
          <p class="step-counter">STEP 05 / 05</p>
          <p class="step-name">COLOR</p>
          <div class="control-wrapper">
            <span class="range-guides left" style="visibility: hidden;">-</span>
            <div class="color-grid" id="palette">
              <div class="color-dot active" data-color="#ffffff" style="background-color: #ffffff;"></div>
              <div class="color-dot" data-color="#d00b1d" style="background-color: #d00b1d;"></div>
              <div class="color-dot" data-color="#010066" style="background-color: #010066;"></div>
              <div class="color-dot" data-color="#FFD400" style="background-color: #FFD400;"></div>
              <div class="color-picker-wrapper"><input type="color" id="custom-color" value="#ffffff"></div>
            </div>
            <span class="range-guides right" style="visibility: hidden;">-</span>
          </div>
        </div>

      </div>
      <button class="nav-arrow" id="next-btn" onclick="changeStep(1)">→</button>
    </div>
    <div class="finish-area"><button class="btn-ui-main btn-regen-mobile" onclick="newDNA()">REGENERATE</button></div>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJExporter } from "three/addons/exporters/OBJExporter.js";

// thicknessパラメータを初期値3で設定に追加
let settings = { size: 3, thickness: 3, bend: 3, bump: 3, color: "#ffffff" };
let dna;

function initDNA() {
  const r1 = Math.random(), r2 = Math.random(), r3 = Math.random();
  dna = {
    seed: Math.random() * 500,
    variationX: (r1 * 2.5 - 1.25),
    variationZ: (r2 * 2.5 - 1.25),
    noiseFrequency: 1.5 + r3 * 3.0, 
    noiseBase: Array.from({ length: 300 }, () => Math.random())
  };
}
initDNA();

let scene, camera, renderer, controls, hornGroup, currentStep = 0;

window.startApp = () => {
  document.getElementById('intro-page').classList.remove('active');
  document.getElementById('main-page').classList.add('active');
  initThree();
};

window.changeStep = (dir) => {
  const steps = document.querySelectorAll('.step-content');
  steps[currentStep].classList.remove('active');
  currentStep = Math.max(0, Math.min(steps.length - 1, currentStep + dir));
  steps[currentStep].classList.add('active');
  document.getElementById('prev-btn').classList.toggle('disabled', currentStep === 0);
  document.getElementById('next-btn').classList.toggle('disabled', currentStep === steps.length - 1);
};

window.setNodeValue = (key, val, element) => {
  const parent = element.parentElement;
  parent.querySelectorAll('.radio-circle').forEach(circle => circle.classList.remove('selected'));
  element.classList.add('selected');
  settings[key] = val;
  updateModel();
};

window.newDNA = () => { initDNA(); updateModel(); };
window.downloadModel = () => {
  const exporter = new OBJExporter();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exporter.parse(hornGroup)], { type: 'text/plain' }));
  a.download = 'tsuno_model.obj'; a.click();
};

function initThree() {
  const c = document.getElementById("viewer-container");
  scene = new THREE.Scene(); scene.background = new THREE.Color(0xffffff);
  camera = new THREE.PerspectiveCamera(40, c.clientWidth/c.clientHeight, 0.1, 1000);
  camera.position.set(0, 5, 22);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(c.clientWidth, c.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById("three-canvas").appendChild(renderer.domElement);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const l = new THREE.DirectionalLight(0xffffff, 1.2); l.position.set(10,20,10); scene.add(l);
  hornGroup = new THREE.Group(); scene.add(hornGroup);
  animate(); updateModel();
}

function getNaturalMaterial() {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(settings.color),
    roughness: 0.7,
    metalness: 0.05,
    side: THREE.DoubleSide
  });
}

function createGrowingHorn(scale = 1.0) {
  const points = [], segments = 80, radSegs = 24;
  
  const baseUnitLength = 2.2; 
  const growthLen = settings.size * baseUnitLength * scale;
  const bendStr = Math.pow(settings.bend, 1.6) * 0.45;
  
  const sX = dna.seed + 1.2;
  const sZ = dna.seed + 2.8;

  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    const curveProgress = t * baseUnitLength * 3.0; 
    const p = new THREE.Vector3(0, t * growthLen, 0);
    
    const curveX = curveProgress * 0.35 + sX + dna.variationX;
    const curveZ = curveProgress * 0.35 + sZ + dna.variationZ;
    
    const xOff = Math.sin(curveX) * bendStr * 0.22 * Math.pow(t, 1.3) * 5.0;
    const zOff = Math.cos(curveZ) * bendStr * 0.22 * Math.pow(t, 1.3) * 5.0;
    
    p.x += xOff; p.z += zOff; 
    points.push(p.add(startPos));
  }
  
  const curve = new THREE.CatmullRomCurve3(points);
  
  // 【修正】太さ（thickness）パラメータを独立して連動
  // settings.sizeの基本的な直径影響を残しつつ、settings.thicknessで太さのボリュームを増減
  const pRadius = 0.6 * (settings.size * 0.03 + 0.5) * (settings.thickness * 0.22 + 0.45);
  
  const vertices = [], indices = [], uvs = [], frames = curve.computeFrenetFrames(segments, false);

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    
    const bumpAmp = Math.pow(settings.bump, 2.0) * 0.015;
    const noiseIdx = Math.floor(t * 299 * dna.noiseFrequency) % 300;
    const bump = 1.0 + (dna.noiseBase[noiseIdx] - 0.5) * bumpAmp * (1.1 - t);
    
    const r = Math.max(0.01, pRadius * Math.pow(1.0 - t, 0.9) * bump);
    
    const p = curve.getPointAt(t), n = frames.normals[i], b = frames.binormals[i];
    for (let j = 0; j <= radSegs; j++) {
      const a = (j / radSegs) * Math.PI * 2;
      const v = new THREE.Vector3().copy(p).add(n.clone().multiplyScalar(Math.cos(a)*r)).add(b.clone().multiplyScalar(Math.sin(a)*r));
      vertices.push(v.x, v.y, v.z);
      uvs.push(j/radSegs, t);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radSegs; j++) {
      const a = i*(radSegs+1)+j, b = (i+1)*(radSegs+1)+j, c = (i+1)*(radSegs+1)+(j+1), d = i*(radSegs+1)+(j+1);
      indices.push(a, b, d, b, c, d);
    }
  }

  const bottomCenterIndex = vertices.length / 3;
  vertices.push(points[0].x, points[0].y, points[0].z); uvs.push(0.5, 0);
  for (let j = 0; j < radSegs; j++) {
    indices.push(bottomCenterIndex, j + 1, j);
  }
  const topCenterIndex = vertices.length / 3;
  const tp = curve.getPointAt(1);
  vertices.push(tp.x, tp.y, tp.z); uvs.push(0.5, 1);
  const lastRowOffset = segments * (radSegs + 1);
  for (let j = 0; j < radSegs; j++) {
    indices.push(topCenterIndex, lastRowOffset + j, lastRowOffset + j + 1);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices); geo.computeVertexNormals();
  return { mesh: new THREE.Mesh(geo, getNaturalMaterial()), curve: curve, frames: frames };
}

function updateModel() {
  if(!hornGroup) return;
  while(hornGroup.children.length > 0) {
    const c = hornGroup.children[0]; c.geometry.dispose(); c.material.dispose(); hornGroup.remove(c);
  }
  
  const main = createGrowingHorn(); 
  hornGroup.add(main.mesh);
  
  const box = new THREE.Box3().setFromObject(hornGroup);
  const center = new THREE.Vector3(); box.getCenter(center);
  hornGroup.children.forEach(m => m.position.sub(center));
}

function animate() { requestAnimationFrame(animate); if (controls) controls.update(); renderer.render(scene, camera); }
</script>
</body>
</html>
